name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          bash -n mlr
          bash -n install.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning mlr install.sh

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch mihomo
        run: |
          TAG=$(curl -fsSLI https://github.com/MetaCubeX/mihomo/releases/latest | tr -d '\r' | sed -n 's#^[Ll]ocation:.*/tag/\(.*\)$#\1#p' | tail -1)
          echo "tag=$TAG"
          curl -fL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$TAG/mihomo-linux-amd64-compatible-$TAG.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          /tmp/mihomo -v
      - name: config matrix
        run: MLR_DRY=1 MLR_ETC=/tmp/mlr-ci MLR_BIN=/tmp/mihomo bash mlr --selftest
